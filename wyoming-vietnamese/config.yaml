name: Wyoming Vietnamese
slug: wyoming_vietnamese
version: 1.0.16
description: Vietnamese speech-to-text and text-to-speech over the Wyoming protocol.
url: https://github.com/luuquangvu/ha-addons/tree/main/wyoming-vietnamese
arch:
  - amd64
  - aarch64
homeassistant: 2025.7.0
startup: services
init: false
ports:
  10300/tcp: 10300
ports_description:
  10300/tcp: Wyoming STT/TTS
environment:
  CACHE_DIR: /data/cache
  DOWNLOAD_DIR: /data/models
  WYOMING_PORT: "10300"
options:
  tts_engine: nghitts
  tts_voice: ngoc-huyen-moi, duy-onyx-moi, thanh-phuong-viettel, ngoc-ngan, mai-phuong
  log_level: info
schema:
  tts_engine: list(nghitts|zerotts)
  tts_voice: str
  log_level: list(debug|info|warning|error|critical)
