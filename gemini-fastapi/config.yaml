name: Gemini FastAPI
slug: gemini_fastapi
version: 1.0.127
breaking_versions:
  - 1.0.123
description: OpenAI-compatible router that proxies Google Gemini for Home Assistant.
url: https://github.com/luuquangvu/ha-addons/tree/main/gemini-fastapi
arch:
  - amd64
  - aarch64
homeassistant: 2025.7.0
startup: services
init: false
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: OpenAI-compatible API port
map:
  - type: homeassistant_config
    read_only: false
environment:
  CONFIG_SERVER__HOST: 0.0.0.0
  CONFIG_SERVER__PORT: "8000"
  CONFIG_STORAGE__PATH: /data/storage/lmdb
  CONFIG_STORAGE__MEDIA_PATH: /data/storage/media
  GEMINI_COOKIE_PATH: /data/cache
options:
  api_key: ""
  clients:
    - id: ""
      secure_1psid: ""
      secure_1psidts: ""
      proxy: ""
  log_level: debug
schema:
  api_key: password
  clients:
    - id: str?
      secure_1psid: password?
      secure_1psidts: password?
      proxy: str?
  log_level: list(debug|info|warning|error|critical)
webui: http://[HOST]:[PORT:8000]/docs
