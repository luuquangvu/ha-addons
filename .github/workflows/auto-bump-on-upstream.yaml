name: Auto bump Home Assistant add-ons on upstream :latest

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force_bump:
        description: Add-on to bump even when its upstream image digest is unchanged
        type: choice
        required: true
        default: none
        options:
          - none
          - gemini-fastapi
          - wyoming-vietnamese
          - all

jobs:
  check-bump-push:
    name: Bump ${{ matrix.addon.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: auto-bump-${{ github.ref_name }}-${{ matrix.addon.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        addon:
          - name: gemini-fastapi
            dir: gemini-fastapi
            upstream: ghcr.io/luuquangvu/gemini-fastapi
            digest_file: .github/upstream-gemini-fastapi.digest
          - name: wyoming-vietnamese
            dir: wyoming-vietnamese
            upstream: ghcr.io/luuquangvu/wyoming-vietnamese
            digest_file: .github/upstream-wyoming-vietnamese.digest
    env:
      ADDON_DIR: ${{ matrix.addon.dir }}
      DIGEST_FILE: ${{ matrix.addon.digest_file }}
      FORCE_BUMP: ${{ github.event_name == 'workflow_dispatch' && (inputs.force_bump == 'all' || inputs.force_bump == matrix.addon.name) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends skopeo

      - name: Extract upstream ref and resolve digest
        id: resolve
        run: |
          UPSTREAM="${{ matrix.addon.upstream }}"
          TRACK_REF="${UPSTREAM}:latest"
          echo "Tracking ref: $TRACK_REF"
          echo "track_ref=$TRACK_REF" >> "$GITHUB_OUTPUT"
          echo "image_name=$UPSTREAM" >> "$GITHUB_OUTPUT"

          MANIFEST_FILE="manifest_raw.json"
          if ! skopeo inspect --raw "docker://$TRACK_REF" > "$MANIFEST_FILE"; then
            echo "::error::Failed to fetch manifest for $TRACK_REF"
            exit 1
          fi

          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://$TRACK_REF")
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::Failed to resolve digest for $TRACK_REF"
            exit 1
          fi

          echo "Latest digest: $DIGEST"
          echo "latest_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "manifest_file=$MANIFEST_FILE" >> "$GITHUB_OUTPUT"

          if [ -f "${DIGEST_FILE}" ]; then
            PREV=$(cat "${DIGEST_FILE}")
          else
            PREV=""
          fi
          echo "Previous digest: ${PREV:-<none>}"

          if [ "$PREV" = "$DIGEST" ] && [ "$FORCE_BUMP" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Digest unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ "$PREV" = "$DIGEST" ]; then
              echo "Digest unchanged, but a version bump was manually requested. Proceeding to validation."
            else
              echo "Digest changed! Proceeding to validation."
            fi
          fi

      - name: Install uv
        if: steps.resolve.outputs.changed == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        if: steps.resolve.outputs.changed == 'true'
        run: uv sync --locked --all-groups

      - name: Set up Node.js
        if: steps.resolve.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        if: steps.resolve.outputs.changed == 'true'
        run: npm ci

      - name: Validate Architectures and Bump Version
        id: bump
        if: steps.resolve.outputs.changed == 'true'
        env:
          TRACK_REF: ${{ steps.resolve.outputs.track_ref }}
          IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
          LATEST_DIGEST: ${{ steps.resolve.outputs.latest_digest }}
          MANIFEST_FILE: ${{ steps.resolve.outputs.manifest_file }}
        run: uv run tools/bump-addon.py

      - name: Format using Prettier (latest version)
        if: steps.resolve.outputs.changed == 'true'
        run: npx prettier --write "${ADDON_DIR}/config.yaml" "${ADDON_DIR}/CHANGELOG.md"

      - name: Lint Home Assistant add-on
        if: steps.resolve.outputs.changed == 'true'
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2
        with:
          path: ${{ env.ADDON_DIR }}

      - name: Commit and push
        if: steps.resolve.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git add "${ADDON_DIR}/config.yaml" "${ADDON_DIR}/Dockerfile" "${DIGEST_FILE}" "${ADDON_DIR}/CHANGELOG.md"

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          MSG="chore(${{ matrix.addon.name }}): bump version to ${{ steps.bump.outputs.new_ver }} (upstream ${{ steps.bump.outputs.upstream_ver }})"
          git commit -m "$MSG"

          for i in {1..5}; do
            echo "Attempting to push... ($i/5)"
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi
            backoff=$((2 ** i))
            jitter=$((RANDOM % 5))
            delay=$((backoff + jitter))
            echo "Push failed, retrying in ${delay}s (base=${backoff}s, jitter=${jitter}s)..."
            sleep "${delay}"
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
